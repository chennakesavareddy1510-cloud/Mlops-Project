version: "3.8"

services:
  mlflow:
    image: python:3.9-slim
    container_name: mlflow-server
    working_dir: /mlflow
    command: >
      sh -c "pip install mlflow &&
             mlflow ui --host 0.0.0.0 --port 5000"
    ports:
      - "5000:5000"

  app:
    build: .
    container_name: mlops-app
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - mlflow